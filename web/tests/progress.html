<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProgressBar and ProgressRing</title>
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="../blocks/progress.css">
<style>
  body { margin: 0; padding: 24px; }
  h1 { margin: 0 0 24px; font-size: var(--ui-font-size-title); font-weight: var(--ui-font-weight-title); }
  h2 { margin: 0 0 16px; font-size: var(--ui-font-size-subtitle); font-weight: var(--ui-font-weight-subtitle); }
  section { margin-block-end: 32px; }
  .grid { display: grid; align-items: center; row-gap: 20px; column-gap: 12px; }
  .bars { grid-template-columns: 160px repeat(4, 200px); column-gap: 30px; }
  .rings { grid-template-columns: 160px repeat(6, 60px); }
  .head { color: var(--ui-system-base-medium-color); font-size: var(--ui-font-size-caption); text-align: center; }
  .rings .head { text-align: center; }
  .rings > :not(.row-label):not(.head) { justify-self: center; }
</style>
</head>
<body>
<h1>Ranges</h1>

<section>
  <h2>ProgressBar</h2>
  <div class="grid bars">
    <span></span><span class="head">Rest</span><span class="head">Hover</span><span class="head">Pressed</span><span class="head">Disabled</span>

    <span class="row-label">Value 40</span>
    <progress class="ui-progress-bar" value="40" max="100" aria-label="Value 40, rest"></progress>
    <progress class="ui-progress-bar" value="40" max="100" aria-label="Value 40, hover"></progress>
    <progress class="ui-progress-bar" value="40" max="100" aria-label="Value 40, pressed"></progress>
    <progress class="ui-progress-bar" value="40" max="100" aria-disabled="true" aria-label="Value 40, disabled"></progress>

    <span class="row-label">With text</span>
    <div class="ui-progress"><progress class="ui-progress-bar" value="40" max="100" aria-label="With text, rest"></progress><span class="ui-progress-text" aria-hidden="true">40%</span></div>
    <div class="ui-progress"><progress class="ui-progress-bar" value="40" max="100" aria-label="With text, hover"></progress><span class="ui-progress-text" aria-hidden="true">40%</span></div>
    <div class="ui-progress"><progress class="ui-progress-bar" value="40" max="100" aria-label="With text, pressed"></progress><span class="ui-progress-text" aria-hidden="true">40%</span></div>
    <div class="ui-progress"><progress class="ui-progress-bar" value="40" max="100" aria-disabled="true" aria-label="With text, disabled"></progress><span class="ui-progress-text" aria-hidden="true">40%</span></div>

    <span class="row-label">Indeterminate</span>
    <progress class="ui-progress-bar" aria-label="Indeterminate, rest"></progress>
    <progress class="ui-progress-bar" aria-label="Indeterminate, hover"></progress>
    <progress class="ui-progress-bar" aria-label="Indeterminate, pressed"></progress>
    <progress class="ui-progress-bar" aria-disabled="true" aria-label="Indeterminate, disabled"></progress>
  </div>
</section>

<section>
  <h2>ProgressRing</h2>
  <div class="grid rings">
    <span></span><span class="head">Rest</span><span class="head">Hover</span><span class="head">Pressed</span><span class="head">Disabled</span><span class="head">Focused</span><span class="head">Live</span>

    <span class="row-label">Value 70</span>
    <progress class="ui-progress-ring" value="70" max="100" aria-label="Value 70, rest"></progress>
    <progress class="ui-progress-ring" value="70" max="100" aria-label="Value 70, hover"></progress>
    <progress class="ui-progress-ring" value="70" max="100" aria-label="Value 70, pressed"></progress>
    <progress class="ui-progress-ring" value="70" max="100" aria-disabled="true" aria-label="Value 70, disabled"></progress>
    <progress class="ui-progress-ring" value="70" max="100" aria-label="Value 70, focused"></progress>
    <progress class="ui-progress-ring" value="70" max="100" aria-label="Value 70, live"></progress>

    <span class="row-label">Indeterminate</span>
    <progress class="ui-progress-ring" aria-label="Indeterminate, rest"></progress>
    <progress class="ui-progress-ring" aria-label="Indeterminate, hover"></progress>
    <progress class="ui-progress-ring" aria-label="Indeterminate, pressed"></progress>
    <progress class="ui-progress-ring" aria-disabled="true" aria-label="Indeterminate, disabled"></progress>
    <progress class="ui-progress-ring" aria-label="Indeterminate, focused"></progress>
    <progress class="ui-progress-ring" aria-label="Indeterminate, live"></progress>

    <span class="row-label">32 px, indeterminate</span>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-label="32 px, rest"></progress>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-label="32 px, hover"></progress>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-label="32 px, pressed"></progress>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-disabled="true" aria-label="32 px, disabled"></progress>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-label="32 px, focused"></progress>
    <progress class="ui-progress-ring" style="--ui-progress-ring-size: 32px" aria-label="32 px, live"></progress>
  </div>
</section>

<script type="module">
  import "../blocks/progress.js";
  // A render is one still image: freeze the animation at its still frame for the comparison.
  if (location.search.includes("still")) document.documentElement.dataset.reduceMotion = "true";
</script>
</body>
</html>
