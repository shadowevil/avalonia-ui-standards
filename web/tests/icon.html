<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon</title>
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../blocks/icon.css">
<link rel="stylesheet" href="../blocks/button.css">
<style>
  /* Laid out like the desktop catalog's Icon page (catalog-page-icon-*.png at 2x), 1064 wide; rendered
     32 px taller than its 861 for the three icons added to the set since that render:
     the content panel at (33, 61), 997 wide, padded 12; a 24 gap between sections. */
  body { margin: 0; min-height: 100vh; background: var(--ui-backdrop-wash); }
  main { position: absolute; left: 33px; top: 61px; width: 997px; bottom: 41px; box-sizing: border-box; padding: 12px; }
  h1 { margin: 6px 0 0; font-size: var(--ui-font-size-title); font-weight: var(--ui-font-weight-title); line-height: normal; }
  h2 { margin: 24px 0 12px; font-size: var(--ui-font-size-subtitle); font-weight: var(--ui-font-weight-subtitle); line-height: normal; }
  .caption { font-size: var(--ui-font-size-caption); color: var(--ui-system-base-medium-color); }
  /* The set: a wrapping row of 232 px entries, icon and name 8 apart, 12 below each. */
  .set { display: flex; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
  .set > li { display: flex; align-items: center; gap: 8px; width: 232px; margin-block-end: 12px; }
  /* Sizes: three icons 8 apart, the caption 8 below, 32 after and 12 below each group. */
  .sizes { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .sizes > div { display: flex; flex-direction: column; gap: 8px; margin: 0 32px 12px 0; }
  .sizes .icons { display: flex; gap: 8px; }
  .sizes + .caption { margin: 12px 0 0; }
  /* The catalog's state grid: a 150 px label column, one auto column per state, 8 between
     columns, 4 between rows, each sample padded 12. */
  .states { display: grid; grid-template-columns: 150px repeat(6, auto); column-gap: 8px; row-gap: 4px; justify-content: start; align-items: center; }
  .states > .caption { justify-self: center; }
  .states > .cell { justify-self: center; padding: 12px; }
  .states > .cell.forced { pointer-events: none; }
</style>
</head>
<body>
<main class="ui-glass ui-squircle">
  <h1>Icon</h1>
  <h2>Set (Phosphor Regular)</h2>
  <ul class="set" id="set"></ul>
  <h2>Sizes</h2>
  <div class="sizes" id="sizes"></div>
  <p class="caption">20 px at Normal density and 16 px at Compact, as in the set above; 24 px for larger use.</p>
  <h2>In a button</h2>
  <div class="states" id="grid"></div>
</main>
<script type="module">
import { icon, iconNames } from "../blocks/icon.js";

// Names shown as on desktop: the Icons property name.
const pascal = (name) => name.replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());

const set = document.getElementById("set");
for (const name of iconNames) {
  const li = document.createElement("li");
  li.append(icon(name), pascal(name));
  set.append(li);
}

const sizes = document.getElementById("sizes");
for (const size of [16, 20, 24]) {
  const group = document.createElement("div");
  const icons = document.createElement("div");
  icons.className = "icons";
  icons.append(...["gear", "caret-down", "house"].map((n) => icon(n, { size })));
  const caption = document.createElement("span");
  caption.className = "caption";
  caption.textContent = `${size} px`;
  group.append(icons, caption);
  sizes.append(group);
}

const grid = document.getElementById("grid");
const add = (cls, child) => {
  const el = document.createElement("div");
  el.className = cls;
  el.append(child);
  grid.append(el);
};
grid.append(document.createElement("div"));
for (const s of ["Rest", "Hover", "Pressed", "Disabled", "Focused", "Live"]) add("caption", s);
add("label", "Accent, with icon");
for (const s of ["Rest", "Hover", "Pressed", "Disabled", "Focused", "Live"]) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "ui-button ui-accent ui-squircle ui-focus-ring";
  button.append(icon("plus"), "Add");
  if (s === "Hover") button.dataset.state = "hover";
  if (s === "Pressed") button.dataset.state = "pressed";
  if (s === "Focused") button.dataset.state = "focus";
  if (s === "Disabled") button.disabled = true;
  if (s !== "Live") button.tabIndex = -1;
  add(s === "Live" ? "cell" : "cell forced", button);
}
</script>
</body>
</html>
