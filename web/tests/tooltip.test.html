<!doctype html>
<html lang="en" data-theme="light" data-reduce-motion="true">
<head>
<meta charset="utf-8">
<title>ToolTip tests</title>
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../blocks/button.css">
<link rel="stylesheet" href="../blocks/tooltip.css">
<style>body { margin: 0; padding: 40px; }</style>
</head>
<body>
<pre id="results">running</pre>
<button id="save" type="button" class="ui-button" aria-describedby="note save-tip">Save</button>
<span id="note">Saves to disk.</span>
<div id="save-tip" class="ui-tooltip ui-squircle" role="tooltip" popover="manual">Save (Ctrl+S)</div>
<button id="other" type="button" class="ui-button">Other</button>
<button id="off" type="button" class="ui-button" disabled>Off</button>
<button id="plain" type="button" class="ui-button">Plain</button>
<script type="module">
import { test, assert, assertEqual } from "./harness.js";
import { setTheme, setDensity } from "../style/index.js";
import { contrastRatio } from "../style/colour.js";
import { tooltip, tooltipOf, showTooltip, hideTooltip, SHOW_DELAY, BETWEEN_DELAY, POINTER_OFFSET, HIDE_GRACE } from "../blocks/tooltip.js";

const $ = (id) => document.getElementById(id);
const rect = (el) => el.getBoundingClientRect();
const near = (a, b, label, tolerance = 1) => assert(Math.abs(a - b) <= tolerance, `${label}: expected ${b}, got ${a}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const open = (el) => el.matches(":popover-open");
const otherTip = tooltip($("other"), "Another tooltip");
const offTip = tooltip($("off"), "Not available while offline");

function rgb(text) {
  let m = text.match(/^color\(srgb ([\d.e-]+) ([\d.e-]+) ([\d.e-]+)/);
  if (m) return [m[1], m[2], m[3]].map((v) => Math.round(v * 255));
  m = text.match(/^rgba?\((\d+), (\d+), (\d+)/);
  return [+m[1], +m[2], +m[3]];
}
function token(name) {
  const probe = document.createElement("div");
  probe.style.color = `var(${name})`;
  document.body.append(probe);
  const value = rgb(getComputedStyle(probe).color);
  probe.remove();
  return value;
}
const over = (el, x = 60, y = 50) => el.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, clientX: x, clientY: y, pointerType: "mouse" }));
const out = (el, to) => el.dispatchEvent(new PointerEvent("pointerout", { bubbles: true, relatedTarget: to, pointerType: "mouse" }));

test("linking: the control keeps its name and is described by the tooltip; tooltip() makes and links one", () => {
  assertEqual(tooltipOf($("save")), $("save-tip"));
  assertEqual($("save-tip").getAttribute("role"), "tooltip");
  assertEqual($("other").getAttribute("aria-describedby"), otherTip.id);
  assertEqual(otherTip.getAttribute("role"), "tooltip");
  assertEqual(otherTip.getAttribute("popover"), "manual");
  assertEqual($("other").nextElementSibling, otherTip);
  assertEqual(tooltipOf($("plain")), null);
});

test("Avalonia's delays and offset", () => {
  assertEqual(SHOW_DELAY, 400);
  assertEqual(BETWEEN_DELAY, 100);
  assertEqual(POINTER_OFFSET, 20);
});

test("look: card colour, 1 px border colour, radius 8, caption 12 px, 8 / 4 padding, 320 max width, primary text", () => {
  showTooltip($("save"));
  const s = getComputedStyle($("save-tip"));
  assertEqual(JSON.stringify(rgb(s.backgroundColor)), JSON.stringify(token("--ui-system-chrome-medium-low-color")));
  assertEqual(JSON.stringify(rgb(s.borderTopColor)), JSON.stringify(token("--ui-system-base-low-color")));
  assertEqual(s.borderTopWidth, "1px");
  assert(["8px", "9.44px"].includes(s.borderTopLeftRadius), `radius ${s.borderTopLeftRadius}`);
  assertEqual(s.fontSize, "12px");
  assertEqual(s.paddingTop, "4px");
  assertEqual(s.paddingLeft, "8px");
  assertEqual(s.maxWidth.includes("320px") || parseFloat(s.maxWidth) <= 320, true);
  assertEqual(JSON.stringify(rgb(s.color)), JSON.stringify(token("--ui-system-base-high-color")));
  assertEqual(s.backdropFilter, "none", "solid, not glass");
  hideTooltip();
});

test("shown by focus: centred below the control, SpacingXS away; hidden when focus leaves", () => {
  showTooltip($("save"), "focus");
  assert(open($("save-tip")), "open");
  const a = rect($("save")), t = rect($("save-tip"));
  near(t.top, a.bottom + 4, "below");
  near(t.left + t.width / 2, a.left + a.width / 2, "centred");
  $("save").focus();
  $("other").focus();
  assert(!open($("save-tip")), "hidden on focus out");
});

test("keyboard focus shows it after the delay", async () => {
  $("plain").focus();
  $("save").focus();
  assert($("save").matches(":focus-visible"), "keyboard focus");
  await wait(SHOW_DELAY + 50);
  assert(open($("save-tip")), "open after focus");
  $("plain").focus();
  assert(!open($("save-tip")), "hidden");
});

test("pointer: shows after 400 ms, 20 px below the pointer; Escape hides it and stops there", async () => {
  over($("save"), 60, 50);
  await wait(SHOW_DELAY - 150);
  assert(!open($("save-tip")), "not yet");
  await wait(200);
  assert(open($("save-tip")), "open");
  near(rect($("save-tip")).top, 50 + POINTER_OFFSET, "20 px below the pointer");
  near(rect($("save-tip")).left, 60, "at the pointer");
  const e = new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true });
  let reached = false;
  const listener = () => { reached = true; };
  $("save").addEventListener("keydown", listener);
  $("save").dispatchEvent(e);
  $("save").removeEventListener("keydown", listener);
  assert(!open($("save-tip")), "hidden by Escape");
  assert(e.defaultPrevented && !reached, "Escape did nothing else");
});

test("hoverable: moving onto the tooltip keeps it; leaving both hides it after the grace", async () => {
  showTooltip($("save"), "pointer");
  out($("save"), $("save-tip"));
  over($("save-tip"));
  await wait(HIDE_GRACE + 50);
  assert(open($("save-tip")), "still open over the tooltip");
  out($("save-tip"), document.body);
  await wait(HIDE_GRACE + 50);
  assert(!open($("save-tip")), "hidden after leaving both");
});

test("moving to another control while one is shown: 100 ms", async () => {
  showTooltip($("save"), "pointer");
  out($("save"), $("other"));
  over($("other"));
  await wait(BETWEEN_DELAY + 50);
  assert(open(otherTip), "the other tooltip after 100 ms");
  assert(!open($("save-tip")), "only one shown");
  hideTooltip();
});

test("pressing the control hides it; a disabled control still shows its tooltip", async () => {
  showTooltip($("save"), "pointer");
  $("save").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
  assert(!open($("save-tip")), "hidden on press");
  over($("off"));
  await wait(SHOW_DELAY + 50);
  assert(open(offTip), "disabled control's tooltip");
  hideTooltip();
});

test("placement stays in the viewport and flips above the pointer near the bottom", () => {
  const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
  over(document.body, vw - 5, vh - 5);
  showTooltip($("save"), "pointer");
  const t = rect($("save-tip"));
  assert(t.right <= vw + 0.5, "inside on the right");
  near(t.bottom, vh - 5, "above the pointer");
  hideTooltip();
});

test("fade-in over MotionFast, none under reduce motion", () => {
  document.documentElement.dataset.reduceMotion = "false";
  showTooltip($("save"));
  assertEqual(getComputedStyle($("save-tip")).animationName, "ui-tooltip-fade-in");
  assertEqual(getComputedStyle($("save-tip")).animationDuration, "0.1s");
  hideTooltip();
  document.documentElement.dataset.reduceMotion = "true";
  showTooltip($("save"));
  assertEqual(getComputedStyle($("save-tip")).animationDuration, "0s");
  hideTooltip();
});

test("contrast: primary text on the card colour meets AA in light and dark; density leaves the card alone", () => {
  for (const theme of ["light", "dark"]) {
    setTheme(theme);
    const r = contrastRatio(token("--ui-system-base-high-color"), token("--ui-system-chrome-medium-low-color"));
    assert(r >= 4.5, `${theme}: ${r.toFixed(2)}`);
  }
  setTheme("light");
  setDensity("compact");
  assertEqual(getComputedStyle($("save-tip")).paddingTop, "4px");
  setDensity("normal");
});
</script>
</body>
</html>
