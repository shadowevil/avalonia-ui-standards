<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shape</title>
<link rel="stylesheet" href="../style/index.css">
<style>
  body { margin: 0; padding: 24px; display: flex; gap: 32px; align-items: flex-start; }
  .column { display: flex; flex-direction: column; gap: 32px; }
  .control { width: 120px; height: 36px; background: var(--ui-accent-fill-color); }
  .panel {
    --ui-squircle-radius: var(--ui-corner-radius-overlay);
    width: 240px; height: 160px; box-sizing: border-box;
    background: var(--ui-system-chrome-medium-low-color); border: 1px solid var(--ui-system-base-low-color);
  }
</style>
</head>
<body>
<div class="column">
  <div class="control ui-squircle ui-focus-ring" tabindex="0"></div>
  <div id="focused" class="control ui-squircle ui-focus-ring" tabindex="0"></div>
</div>
<div class="panel ui-squircle"></div>
<script type="module">document.getElementById("focused").focus({ focusVisible: true });</script>
</body>
</html>
