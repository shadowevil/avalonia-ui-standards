<!doctype html>
<html lang="en-US" data-theme="light" data-reduce-motion="true">
<head>
<meta charset="utf-8">
<title>TimePicker tests</title>
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../blocks/icon.css">
<link rel="stylesheet" href="../blocks/button.css">
<link rel="stylesheet" href="../blocks/text-input.css">
<link rel="stylesheet" href="../blocks/flyout.css">
<link rel="stylesheet" href="../blocks/date-picker.css">
<link rel="stylesheet" href="../blocks/time-picker.css">
</head>
<body style="padding: 100px 40px 400px">
<pre id="results">running</pre>
<form id="form">
  <ui-time-picker id="tp" aria-label="Alarm" value="09:41" clock="12" name="alarm"></ui-time-picker>
</form>
<ui-time-picker id="h24" aria-label="24-hour" value="21:41" clock="24"></ui-time-picker>
<ui-time-picker id="empty" aria-label="Empty" clock="12"></ui-time-picker>
<ui-time-picker id="gb" aria-label="Locale clock" lang="en-GB" value="07:05"></ui-time-picker>
<ui-time-picker id="ko" aria-label="Korean" lang="ko-KR" value="21:05" clock="12"></ui-time-picker>
<script type="module">
import { test, assert, assertEqual } from "./harness.js";
import "../blocks/time-picker.js";

const html = document.documentElement;
const $ = (id) => document.getElementById(id);
const style = (el) => getComputedStyle(el);
const tp = $("tp");
const field = (p = tp) => p.querySelector(".ui-date-picker-field");
const flyout = (p = tp) => p.querySelector(".ui-date-picker-flyout");
const selector = (part, p = tp) => flyout(p).querySelector(`.ui-date-picker-selector[data-part="${part}"]`);
const rows = (part, p = tp) => [...selector(part, p).querySelectorAll(".ui-date-picker-row")].map((r) => r.textContent);
const segments = (p) => [...field(p).querySelectorAll(".ui-date-picker-segment")].map((s) => s.textContent).join(" ");
const tick = () => new Promise((r) => setTimeout(r, 20));
const key = (target, k, options = {}) => {
  const e = new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...options });
  target.dispatchEvent(e);
  return e;
};

function reset() {
  html.removeAttribute("data-density");
  for (const p of document.querySelectorAll("ui-time-picker")) p.close();
  tp.value = "09:41";
  document.activeElement?.blur();
}

test("segments: hour, minute and period on a 12-hour clock; hour and minute on a 24-hour clock", () => {
  reset();
  assertEqual(segments(tp), "9 41 AM");
  assertEqual(segments($("h24")), "21 41");
  assertEqual($("h24").clock, 24);
  assertEqual(field(tp).querySelectorAll(".ui-date-picker-divider").length, 2);
  assertEqual(field($("h24")).querySelectorAll(".ui-date-picker-divider").length, 1);
});

test("locale: the clock and the period's place from Intl", () => {
  assertEqual($("gb").clock, 24);
  assertEqual(segments($("gb")), "7 05");
  assertEqual([...field($("ko")).querySelectorAll(".ui-date-picker-segment")].map((s) => s.dataset.part).join(","), "period,hour,minute");
  assertEqual(segments($("ko")), "오후 9 05");
});

test("empty: the placeholders in the placeholder colour, and the period of the current time", () => {
  const segs = [...field($("empty")).querySelectorAll(".ui-date-picker-segment")];
  assertEqual(segs[0].textContent, "hour");
  assertEqual(segs[1].textContent, "minute");
  assertEqual(segs[2].textContent, new Date().getHours() < 12 ? "AM" : "PM");
  assert(segs.every((s) => s.hasAttribute("data-placeholder")));
});

test("field: 244 wide (Fluent's 242 inside the border), equal columns, 32 high (24 Compact)", () => {
  reset();
  assertEqual(field().getBoundingClientRect().width, 244);
  const widths = [...field().querySelectorAll(".ui-date-picker-segment")].map((s) => s.getBoundingClientRect().width);
  assertEqual(widths.join(","), "80,80,80");
  assertEqual(field().getBoundingClientRect().height, 32);
  html.dataset.density = "compact";
  assertEqual(field().getBoundingClientRect().height, 24);
  reset();
});

test("flyout: hours 1 to 12 and minutes loop, the period does not; spinbutton values", async () => {
  reset();
  field().click();
  await tick();
  assertEqual(flyout().getAttribute("aria-label"), "Choose a time");
  assertEqual(rows("hour").join(","), "6,7,8,9,10,11,12");
  assertEqual(rows("minute").join(","), "38,39,40,41,42,43,44");
  assertEqual(rows("period").join(","), ",,,AM,PM,,");
  assertEqual(selector("hour").getAttribute("aria-valuenow"), "9");
  assertEqual(selector("minute").getAttribute("aria-valuemax"), "59");
  assertEqual(selector("period").getAttribute("aria-label"), "AM/PM");
  assertEqual(selector("period").getAttribute("aria-valuetext"), "AM");
  key(selector("hour"), "ArrowDown");
  key(selector("hour"), "ArrowDown");
  key(selector("hour"), "ArrowDown");
  key(selector("hour"), "ArrowDown");
  assertEqual(selector("hour").getAttribute("aria-valuetext"), "1", "12 loops to 1");
  key(selector("period"), "ArrowDown");
  assertEqual(selector("period").getAttribute("aria-valuetext"), "PM");
  key(selector("period"), "ArrowDown");
  assertEqual(selector("period").getAttribute("aria-valuetext"), "PM", "the period stops at its end");
  key(selector("minute"), "End");
  selector("minute").focus();
  key(selector("minute"), "Enter");
  await tick();
  assertEqual(tp.value, "13:59");
  assertEqual(segments(tp), "1 59 PM");
  reset();
});

test("12 AM is midnight and 12 PM noon", async () => {
  reset();
  tp.value = "00:30";
  assertEqual(segments(tp), "12 30 AM");
  tp.value = "12:30";
  assertEqual(segments(tp), "12 30 PM");
  field().click();
  await tick();
  assertEqual(selector("hour").getAttribute("aria-valuetext"), "12");
  key(selector("period"), "ArrowUp");
  flyout().querySelector(".ui-date-picker-accept").click();
  await tick();
  assertEqual(tp.value, "00:30");
  reset();
});

test("24-hour flyout: hours 0 to 23", async () => {
  reset();
  field($("h24")).click();
  await tick();
  assertEqual(rows("hour", $("h24")).join(","), "18,19,20,21,22,23,0");
  assertEqual(flyout($("h24")).querySelectorAll(".ui-date-picker-selector").length, 2);
  $("h24").close();
});

test("form: submits HH:MM with its name and resets to the value attribute", () => {
  reset();
  assertEqual(new FormData($("form")).get("alarm"), "09:41");
  tp.value = "18:00";
  $("form").reset();
  assertEqual(tp.value, "09:41");
});

test("period-label and the flyout strings follow their attributes", async () => {
  reset();
  field().click();
  await tick();
  tp.setAttribute("period-label", "Tageszeit");
  tp.setAttribute("accept-label", "OK");
  assertEqual(selector("period").getAttribute("aria-label"), "Tageszeit");
  assertEqual(flyout().querySelector(".ui-date-picker-accept").getAttribute("aria-label"), "OK");
  tp.removeAttribute("period-label");
  tp.removeAttribute("accept-label");
  assertEqual(selector("period").getAttribute("aria-label"), "AM/PM");
  reset();
});

test("the value attribute is the initial value until the value changes; reset goes back to it", () => {
  reset();
  $("form").reset();
  tp.setAttribute("value", "10:00");
  assertEqual(tp.value, "10:00");
  tp.value = "11:30";
  tp.setAttribute("value", "08:15");
  assertEqual(tp.value, "11:30");
  $("form").reset();
  assertEqual(tp.value, "08:15");
  tp.setAttribute("value", "09:41");
  $("form").reset();
});
</script>
</body>
</html>
