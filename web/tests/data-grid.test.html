<!doctype html>
<html lang="en" data-theme="light" data-reduce-motion="true">
<head>
<meta charset="utf-8">
<title>DataGrid tests</title>
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../blocks/icon.css">
<link rel="stylesheet" href="../blocks/scroll.css">
<link rel="stylesheet" href="../blocks/list-box.css">
<link rel="stylesheet" href="../blocks/text-input.css">
<link rel="stylesheet" href="../blocks/toggles.css">
<link rel="stylesheet" href="../blocks/flyout.css">
<link rel="stylesheet" href="../blocks/combobox.css">
<link rel="stylesheet" href="../blocks/data-grid.css">
<style>
  ui-data-grid { inline-size: 420px; block-size: 200px; margin-block-end: 8px; }
  #narrow { inline-size: 300px; }
</style>
</head>
<body>
<pre id="results">running</pre>
<ui-data-grid id="grid" class="ui-squircle" can-resize-columns>
  <table aria-label="Parts">
    <thead>
      <tr>
        <th data-width="120">Name</th>
        <th data-width="90" data-type="number">Count</th>
        <th data-width="100" data-type="check">In stock</th>
        <th data-width="130" data-type="combo" data-options="Style|Blocks|Modules">Category</th>
        <th data-width="*" data-min-width="160" data-can-resize="false">Notes</th>
      </tr>
    </thead>
    <tbody>
      <tr data-name="accent"><td>Accent</td><td>12</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td><td>Style</td><td>Brand</td></tr>
      <tr data-name="swatch"><td>Swatch</td><td>3</td><td><input type="checkbox" class="ui-check-box ui-squircle"></td><td>Blocks</td><td>Chip</td></tr>
      <tr data-name="button"><td>Button</td><td>48</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td><td>Blocks</td><td>Variants</td></tr>
      <tr data-name="sidebar"><td>Sidebar</td><td>7</td><td><input type="checkbox" class="ui-check-box ui-squircle"></td><td>Modules</td><td>Rail</td></tr>
      <tr data-name="radius"><td>Radius</td><td>2</td><td><input type="checkbox" class="ui-check-box ui-squircle"></td><td>Style</td><td>Corners</td></tr>
      <tr data-name="glass"><td>Glass</td><td>5</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td><td>Style</td><td>Blur</td></tr>
      <tr data-name="spacing"><td>Spacing</td><td>7</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td><td>Style</td><td>Grid</td></tr>
    </tbody>
  </table>
</ui-data-grid>
<ui-data-grid id="ro" class="ui-squircle" readonly selection-mode="single" grid-lines="all">
  <table aria-label="Read-only">
    <thead><tr><th data-width="120">Name</th><th data-width="100" data-type="check">In stock</th></tr></thead>
    <tbody>
      <tr data-name="ro-a"><td>A</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td></tr>
      <tr data-name="ro-b"><td>B</td><td><input type="checkbox" class="ui-check-box ui-squircle"></td></tr>
    </tbody>
  </table>
</ui-data-grid>
<ui-data-grid id="off" class="ui-squircle" disabled>
  <table aria-label="Disabled">
    <thead><tr><th data-width="120">Name</th><th data-width="100" data-type="check">In stock</th></tr></thead>
    <tbody>
      <tr data-name="off-a"><td>A</td><td><input type="checkbox" class="ui-check-box ui-squircle" checked></td></tr>
      <tr data-name="off-b" aria-selected="true"><td>B</td><td><input type="checkbox" class="ui-check-box ui-squircle"></td></tr>
    </tbody>
  </table>
</ui-data-grid>
<ui-data-grid id="narrow" class="ui-squircle" frozen-columns="1">
  <table aria-label="Frozen">
    <thead><tr><th data-width="100">Name</th><th data-width="150">B</th><th data-width="150">C</th></tr></thead>
    <tbody>
      <tr><td>One</td><td>b1</td><td>c1</td></tr>
      <tr><td>Two</td><td>b2</td><td>c2</td></tr>
    </tbody>
  </table>
</ui-data-grid>
<ui-data-grid id="rtl" dir="rtl" class="ui-squircle">
  <table aria-label="RTL">
    <thead><tr><th data-width="100">A</th><th data-width="100">B</th></tr></thead>
    <tbody><tr><td>a</td><td>b</td></tr></tbody>
  </table>
</ui-data-grid>
<script type="module">
import { test, assert, assertEqual } from "./harness.js";
import { setTheme, setDensity, setAccent } from "../style/index.js";
import { contrastRatio } from "../style/colour.js";
import "../blocks/data-grid.js";

const $ = (id) => document.getElementById(id);
const grid = $("grid");
const r = (name) => document.querySelector(`tr[data-name="${name}"]`);
const cell = (name, i) => r(name).cells[i];
const th = (g, i) => g.querySelectorAll("th")[i];
const names = (g) => g.rows.map((row) => row.cells[0].textContent.trim());
const selected = (g) => g.selectedRows.map((row) => row.dataset.name);
const tick = () => new Promise((res) => setTimeout(res));
// Headless virtual time runs no frames, so scroll events are sent by hand after scrolling.
const scrolled = (el) => el.dispatchEvent(new Event("scroll"));

function rgba(text) {
  let m = text.match(/^color\(srgb ([\d.e-]+) ([\d.e-]+) ([\d.e-]+)(?: \/ ([\d.e-]+))?\)$/);
  if (m) return [...[m[1], m[2], m[3]].map((v) => Math.round(v * 255)), m[4] === undefined ? 1 : +(+m[4]).toFixed(3)];
  m = text.match(/^rgba?\((\d+), (\d+), (\d+)(?:, ([\d.]+))?\)$/);
  if (m) return [+m[1], +m[2], +m[3], m[4] === undefined ? 1 : +(+m[4]).toFixed(3)];
  throw new Error(`unparsed colour ${text}`);
}
const hex = (text) => "#" + rgba(text).slice(0, 3).map((c) => c.toString(16).padStart(2, "0").toUpperCase()).join("");
const css = (el, prop, pseudo) => getComputedStyle(el, pseudo).getPropertyValue(prop);
const bg = (el, pseudo) => hex(getComputedStyle(el, pseudo).backgroundColor);
const fg = (el) => hex(getComputedStyle(el).color);
const tokenHex = (name) => {
  const probe = document.createElement("div");
  probe.style.color = `var(${name})`;
  document.body.append(probe);
  const v = hex(getComputedStyle(probe).color);
  probe.remove();
  return v;
};
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const ratio = (a, b) => contrastRatio(rgb(a), rgb(b));
const transparent = (el, pseudo) => rgba(getComputedStyle(el, pseudo).backgroundColor)[3] === 0;

function key(el, k, options = {}) {
  const e = new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true, ...options });
  el.dispatchEvent(e);
  return e.defaultPrevented;
}
// A press at the element's centre (clear of a header's resize zones) unless given a point.
function press(el, options = {}) {
  const b = el.getBoundingClientRect();
  const at = { clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 };
  const e = new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 0, ...at, ...options });
  el.dispatchEvent(e);
  return e;
}
function click(el, options = {}) {
  press(el, options);
  const e = new MouseEvent("click", { bubbles: true, cancelable: true, detail: 1, ...options });
  el.dispatchEvent(e);
  return e.defaultPrevented;
}
const mod = /Mac|iPhone|iPad/.test(navigator.platform) ? { metaKey: true } : { ctrlKey: true };

test("roles and states on the table", () => {
  const table = grid.table;
  assertEqual(table.getAttribute("role"), "grid");
  assertEqual(table.getAttribute("aria-multiselectable"), "true", "extended by default");
  assertEqual(table.getAttribute("aria-label"), "Parts");
  assertEqual(table.tHead.getAttribute("role"), "rowgroup");
  assertEqual(r("accent").getAttribute("role"), "row");
  assertEqual(th(grid, 0).getAttribute("role"), "columnheader");
  assertEqual(cell("accent", 0).getAttribute("role"), "gridcell");
  assertEqual(r("accent").getAttribute("aria-selected"), "false");
  assertEqual($("ro").table.getAttribute("aria-readonly"), "true");
  assertEqual($("ro").table.hasAttribute("aria-multiselectable"), false, "single selection");
  assertEqual($("off").table.getAttribute("aria-disabled"), "true");
  const box = cell("accent", 2).querySelector("input");
  assertEqual(box.getAttribute("aria-labelledby"), th(grid, 2).id, "check boxes named by their header");
  assert(th(grid, 0).querySelectorAll(".ui-data-grid-sort[aria-hidden='true']").length === 2, "sort carets are decoration");
  assertEqual(grid.getAttribute("data-scroll-shadows"), "false", "no scroll-edge shadows");
  assert(grid.classList.contains("ui-scroll"), "overlay bars");
});

test("one Tab stop: the current cell, a check cell's CheckBox", () => {
  const stops = [...grid.querySelectorAll("[tabindex='0']")];
  assertEqual(stops.length, 1);
  assertEqual(stops[0], cell("accent", 0));
  assertEqual(cell("accent", 2).hasAttribute("tabindex"), false, "a check cell's focus is its box");
  assertEqual(cell("accent", 2).querySelector("input").getAttribute("tabindex"), "-1");
  assertEqual([...$("off").querySelectorAll("[tabindex]")].length, 0, "a disabled grid takes no focus");
  assert($("off").querySelectorAll("input:disabled").length === 2, "its check boxes are disabled");
});

test("columns: widths, star column and filler", () => {
  const ths = grid.querySelectorAll("th");
  assertEqual(ths[0].offsetWidth, 120);
  assertEqual(ths[1].offsetWidth, 90);
  assertEqual(ths[4].offsetWidth, 160, "the star column at its minimum (420 - 440 overflows)");
  const ro = $("ro");
  assertEqual(r("ro-a").offsetWidth, ro.clientWidth, "with no star column the row still spans the grid");
});

test("arrow keys move the current cell and select rows", () => {
  grid.selectedRow = null;
  const start = cell("accent", 0);
  start.focus();
  assert(key(start, "ArrowDown"), "handled");
  assertEqual(document.activeElement, cell("swatch", 0));
  assertEqual(selected(grid).join(), "swatch");
  key(cell("swatch", 0), "ArrowRight");
  assertEqual(document.activeElement, cell("swatch", 1));
  key(cell("swatch", 1), "ArrowRight");
  assertEqual(document.activeElement, cell("swatch", 2).querySelector("input"), "focus goes to the CheckBox");
  key(document.activeElement, "ArrowDown", { shiftKey: true });
  assertEqual(selected(grid).join(), "swatch,button", "Shift extends");
  key(document.activeElement, "End");
  assertEqual(document.activeElement, cell("button", 4));
  key(document.activeElement, "Home");
  assertEqual(document.activeElement, cell("button", 0));
  key(document.activeElement, "End", mod);
  assertEqual(document.activeElement, cell("spacing", 4));
  key(document.activeElement, "Home", mod);
  assertEqual(document.activeElement, cell("accent", 0));
  assertEqual(selected(grid).join(), "accent");
  key(document.activeElement, "ArrowUp");
  assertEqual(document.activeElement, th(grid, 0), "up from the first row reaches the header");
  assertEqual(selected(grid).join(), "accent", "the header does not change the selection");
  key(document.activeElement, "ArrowDown");
  assertEqual(document.activeElement, cell("accent", 0));
  assert(!key(document.activeElement, "x"), "other keys are not handled");
  assertEqual(grid.querySelectorAll("[tabindex='0']").length, 1, "still one Tab stop");
});

test("Space, Ctrl or Cmd+Space and Ctrl or Cmd+A", () => {
  cell("accent", 0).focus();
  key(cell("accent", 0), "ArrowDown");
  key(cell("swatch", 0), " ", mod);
  assertEqual(selected(grid).join(), "", "toggled off");
  key(cell("swatch", 0), " ");
  assertEqual(selected(grid).join(), "swatch");
  key(cell("swatch", 0), "a", mod);
  assertEqual(selected(grid).length, 7);
  let changes = 0;
  grid.addEventListener("change", () => changes++, { once: true });
  key(cell("swatch", 0), "ArrowDown");
  assertEqual(changes, 1, "change fires");
  assertEqual(selected(grid).join(), "button");
});

test("pointer selection: press, Ctrl or Cmd, Shift", () => {
  press(cell("accent", 1));
  assertEqual(selected(grid).join(), "accent");
  press(cell("button", 1), mod);
  assertEqual(selected(grid).join(), "accent,button");
  press(cell("sidebar", 0), { shiftKey: true });
  assertEqual(selected(grid).join(), "button,sidebar", "Shift extends from the anchor");
  const e = press(cell("radius", 2));
  assert(e.defaultPrevented, "a press beside a CheckBox focuses it");
  assertEqual(document.activeElement, cell("radius", 2).querySelector("input"));
});

test("keyboard ring: keys show it, a press hides it", async () => {
  cell("accent", 0).focus();
  press(cell("accent", 0));
  assert(!grid.hasAttribute("data-keyboard"), "pointer");
  grid.selectedRow = null;
  const ring = (c) => css(c, "visibility", "::after");
  key(cell("accent", 0), "ArrowRight");
  assert(grid.hasAttribute("data-keyboard"), "a key in the grid");
  assertEqual(ring(cell("accent", 1)), "visible");
  assertEqual(ring(cell("accent", 0)), "hidden");
  const accent = tokenHex("--ui-system-accent-color");
  assertEqual(hex(css(cell("accent", 1), "border-top-color", "::after")), accent, "the accent ring");
  assertEqual(css(cell("accent", 1), "border-top-width", "::after"), "2px");
  assertEqual(css(cell("accent", 1), "top", "::after"), "2px", "inset 2");
  // On a selected row the ring is white.
  grid.selectedRow = r("accent");
  assertEqual(hex(css(cell("accent", 1), "border-top-color", "::after")), tokenHex("--ui-accent-button-foreground"));
  key(cell("accent", 1), "ArrowRight");
  assertEqual(ring(cell("accent", 2)), "visible", "the ring on a check cell");
  $("narrow").querySelector("td").focus();
  await tick();
  assert(!grid.hasAttribute("data-keyboard"), "leaving the grid ends it");
});

test("sorting: click, keys, aria-sort, numbers and checks", () => {
  click(th(grid, 1));
  assertEqual(th(grid, 1).getAttribute("aria-sort"), "ascending");
  assertEqual(names(grid).join(), "Radius,Swatch,Glass,Sidebar,Spacing,Accent,Button", "numeric, stable");
  click(th(grid, 1));
  assertEqual(th(grid, 1).getAttribute("aria-sort"), "descending");
  assertEqual(names(grid)[0], "Button");
  const caret = th(grid, 1).querySelector(".ui-data-grid-sort-descending");
  assert(getComputedStyle(caret).display !== "none", "the descending caret shows");
  assertEqual(caret.getBoundingClientRect().width, 16, "16 px caret");
  assertEqual(getComputedStyle(th(grid, 1).querySelector(".ui-data-grid-sort-ascending")).display, "none");
  th(grid, 0).focus();
  assert(key(th(grid, 0), "Enter"), "Enter sorts on a header");
  assertEqual(th(grid, 0).getAttribute("aria-sort"), "ascending");
  assertEqual(th(grid, 1).hasAttribute("aria-sort"), false, "one sorted column");
  assertEqual(names(grid).join(), "Accent,Button,Glass,Radius,Sidebar,Spacing,Swatch");
  key(th(grid, 2), " ");
  assertEqual(names(grid).slice(0, 3).join(), "Radius,Sidebar,Swatch", "unchecked first");
  grid.addEventListener("sorting", (e) => e.preventDefault(), { once: true });
  assertEqual(grid.sort(0), false, "sorting is cancelable");
  grid.sort(0, "ascending");
});

test("editing a text cell: F2, Enter commits and moves down, Escape cancels", () => {
  grid.sort(0, "ascending");
  const c = cell("accent", 0);
  c.focus();
  let detail = null;
  grid.addEventListener("celleditended", (e) => (detail = e.detail), { once: true });
  assert(key(c, "F2"), "F2 edits");
  const input = c.querySelector("input.ui-text-input");
  assert(input, "a field");
  assertEqual(document.activeElement, input);
  assertEqual(grid.editingCell, c);
  const rc = c.getBoundingClientRect(), ri = input.getBoundingClientRect();
  assertEqual(ri.height, rc.height, "the field fills the cell");
  assertEqual(ri.width, rc.width);
  assertEqual(css(input, "padding-left"), "11px", "padding one less than the cell's");
  assertEqual(css(input, "outline-style"), "none", "no ring of its own");
  assertEqual(css(c, "visibility", "::after"), "hidden", "no cell ring while editing");
  input.value = "Accent 2";
  key(input, "Enter");
  assertEqual(c.textContent, "Accent 2");
  assertEqual(detail?.value, "Accent 2");
  assertEqual(detail?.oldValue, "Accent");
  assertEqual(document.activeElement, cell("button", 0), "moved down");
  key(cell("button", 0), "F2");
  cell("button", 0).querySelector("input").value = "Nope";
  key(cell("button", 0).querySelector("input"), "Escape");
  assertEqual(cell("button", 0).textContent, "Button", "cancelled");
  assertEqual(document.activeElement, cell("button", 0));
});

test("editing: a number column validates; leaving commits", async () => {
  const c = cell("swatch", 1);
  c.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, cancelable: true }));
  const input = c.querySelector("input");
  assert(input, "double click edits");
  input.value = "abc";
  key(input, "Enter");
  assertEqual(input.getAttribute("aria-invalid"), "true", "invalid stays in edit");
  assertEqual(c.getAttribute("aria-invalid"), "true");
  assertEqual(hex(css(input, "border-top-color")), tokenHex("--ui-danger-color"), "danger border");
  assertEqual(+css(r("swatch"), "opacity", "::before"), 0.4, "the invalid row's tint");
  input.value = "30";
  $("narrow").querySelector("td").focus();
  await tick();
  assertEqual(c.textContent, "30", "leaving commits");
  assertEqual(c.hasAttribute("data-editing"), false);
  assertEqual(+css(r("swatch"), "opacity", "::before"), 0);
});

test("editing: the field on a selected row has a white border", () => {
  grid.selectedRow = r("glass");
  const c = cell("glass", 4);
  assert(grid.beginEdit(c));
  assertEqual(hex(css(c.querySelector("input"), "border-top-color")), tokenHex("--ui-accent-button-foreground"));
  grid.cancelEdit();
});

test("editing: a combo column edits with a ComboBox", async () => {
  const c = cell("sidebar", 3);
  assert(grid.beginEdit(c));
  const box = c.querySelector("ui-combo-box");
  assert(box, "a ComboBox");
  await tick();
  assertEqual(box.value, "Modules");
  assertEqual(box.getBoundingClientRect().height, c.getBoundingClientRect().height, "fills the cell");
  box.selectedIndex = 0;
  assert(grid.commitEdit());
  assertEqual(c.textContent, "Style");
});

test("check cells: toggle when editable, not when read-only", () => {
  const box = cell("accent", 2).querySelector("input");
  const was = box.checked;
  let detail = null;
  grid.addEventListener("celleditended", (e) => (detail = e.detail), { once: true });
  box.click();
  assertEqual(box.checked, !was, "toggles");
  assertEqual(detail?.value, !was);
  const ro = r("ro-a").cells[1].querySelector("input");
  assertEqual(ro.getAttribute("aria-readonly"), "true");
  ro.click();
  assertEqual(ro.checked, true, "read-only keeps it");
  assertEqual(ro.disabled, false, "read-only keeps the enabled look");
  assert(!$("ro").beginEdit(r("ro-a").cells[0]), "read-only does not edit");
});

test("check box on a selected row inverts", () => {
  grid.selectedRow = r("glass");
  const on = cell("glass", 2).querySelector("input");
  const white = tokenHex("--ui-accent-button-foreground");
  assert(on.checked);
  assertEqual(bg(on, "::after"), white, "a white box");
  assertEqual(bg(on, "::before"), tokenHex("--ui-accent-fill-color"), "an accent mark");
  grid.selectedRow = r("radius");
  const off = cell("radius", 2).querySelector("input");
  assertEqual(hex(css(off, "border-top-color")), white, "a white outline");
});

test("resizing: grip, drag, keys", () => {
  const h = th(grid, 0);
  const rect = h.getBoundingClientRect();
  h.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: rect.right - 2, clientY: rect.top + 5 }));
  assertEqual(h.getAttribute("data-resize"), "end", "near the end edge");
  const grip = h.querySelector(".ui-data-grid-grip");
  assertEqual(css(grip, "opacity"), "1");
  assertEqual(grip.getBoundingClientRect().width, 4);
  assertEqual(grip.getBoundingClientRect().height, 24, "the header less 4 above and below");
  const probe = document.createElement("span");
  probe.style.color = "var(--ui-scroll-bar-thumb-hover)";
  grid.append(probe);
  assertEqual(getComputedStyle(grip).backgroundColor, getComputedStyle(probe).color, "the thumb's hover colour");
  probe.remove();
  const next = th(grid, 1);
  const nr = next.getBoundingClientRect();
  next.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: nr.left + 2, clientY: nr.top + 5 }));
  assertEqual(next.getAttribute("data-resize"), "start", "the start edge resizes the previous column");
  assertEqual(h.hasAttribute("data-resize"), false);
  const notes = th(grid, 4);
  const sr = notes.getBoundingClientRect();
  notes.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: sr.right - 2, clientY: sr.top + 5 }));
  assertEqual(notes.hasAttribute("data-resize"), false, "data-can-resize=false");
  // Drag.
  h.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 0, clientX: rect.right - 2, clientY: rect.top + 5, pointerId: 1 }));
  grid.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: rect.right + 28, clientY: rect.top + 5 }));
  assertEqual(h.offsetWidth, 150, "dragged 30 px wider");
  h.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
  h.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
  assertEqual(h.getAttribute("aria-sort"), "ascending", "the resize press does not sort");
  h.focus();
  assert(key(h, "ArrowLeft", { shiftKey: true }));
  assertEqual(h.offsetWidth, 142, "Shift+Left narrows by 8");
  grid.dispatchEvent(new PointerEvent("pointerleave"));
  assertEqual(h.hasAttribute("data-resize"), false);
  assertEqual($("ro").querySelector("th").dataset.canResize, undefined);
  const roTh = $("ro").querySelector("th");
  assert(!key(roTh, "ArrowRight", { shiftKey: true }) || roTh.offsetWidth === 120, "no resize without can-resize-columns");
});

test("frozen columns stick and clip what scrolls under them", () => {
  const g = $("narrow");
  const first = g.querySelector("tbody td");
  const second = first.nextElementSibling;
  assert(first.hasAttribute("data-frozen"));
  assertEqual(getComputedStyle(first).position, "sticky");
  g.scrollLeft = 60;
  scrolled(g);
  assertEqual(Math.round(first.getBoundingClientRect().left - g.getBoundingClientRect().left), 0, "stays at the start");
  assertEqual(css(g, "--ui-data-grid-frozen-width").trim(), "100px");
  assertEqual(css(second, "clip-path"), "inset(0px 0px 0px 60px)", "clipped at the frozen edge");
  g.scrollLeft = 0;
  scrolled(g);
});

test("rows scrolled under the header are clipped", () => {
  grid.scrollTop = 40;
  scrolled(grid);
  assertEqual(css(grid.table.tBodies[0], "clip-path"), "inset(40px 0px 0px)");
  assertEqual(Math.round(grid.table.tHead.getBoundingClientRect().top), Math.round(grid.getBoundingClientRect().top), "the header stays");
  grid.scrollTop = 0;
  scrolled(grid);
});

test("the vertical overlay bar starts below the header; scrolling into view keeps clear of it", async () => {
  await new Promise((res) => setTimeout(res, 50)); // scroll.js attaches on its own scan
  for (const density of ["normal", "compact"]) {
    setDensity(density);
    grid.dispatchEvent(new Event("scroll"));
    const bar = grid.querySelector(":scope > .ui-scroll-overlay > .ui-scroll-bar[data-orientation='vertical']");
    assert(bar && !bar.hidden, "a vertical bar");
    const head = grid.table.tHead.getBoundingClientRect().height;
    // Against the overlay (the viewport's box), which a frameless headless run may not have moved.
    const overlay = bar.parentElement.getBoundingClientRect();
    assertEqual(Math.round(bar.getBoundingClientRect().top - overlay.top), Math.round(head), `${density} under the header`);
    assertEqual(css(grid, "scroll-padding-top"), `${head}px`);
  }
  setDensity("normal");
});

test("colours: rows, header, lines, disabled", () => {
  setTheme("light");
  for (const theme of ["light", "dark"]) {
    setTheme(theme);
    grid.selectedRow = null;
    const row = r("button");
    assert(transparent(row), `${theme} rest`);
    row.dataset.state = "hover";
    assertEqual(bg(row), tokenHex("--ui-system-list-medium-color"), `${theme} hover`);
    row.setAttribute("aria-selected", "true");
    assertEqual(bg(row), tokenHex("--ui-accent-fill-color-pointer-over"), `${theme} selected hover`);
    delete row.dataset.state;
    assertEqual(bg(row), tokenHex("--ui-accent-fill-color"), `${theme} selected`);
    assertEqual(fg(row.cells[0]), tokenHex("--ui-accent-button-foreground"));
    row.setAttribute("aria-selected", "false");
    const h = th(grid, 3);
    assertEqual(fg(h), tokenHex("--ui-system-base-medium-color"), `${theme} header text`);
    assertEqual(css(h, "font-weight"), "600");
    h.dataset.state = "pressed";
    assertEqual(bg(h), tokenHex("--ui-system-base-medium-low-color"));
    delete h.dataset.state;
    assertEqual(hex(css(row, "border-bottom-color", "::after")), tokenHex("--ui-system-base-low-color"), "horizontal hairline");
    assertEqual(css(row, "border-bottom-width", "::after"), "1px");
    assertEqual(css(row.cells[0], "border-right-width", "::before"), "0px", "no vertical lines by default");
    assertEqual(css(r("ro-a").cells[0], "border-right-width", "::before"), "1px", "grid-lines=all");
    assertEqual(fg(r("off-a").cells[0]), tokenHex("--ui-system-base-medium-low-color"), "disabled text");
    assertEqual(fg($("off").querySelector("th")), tokenHex("--ui-system-base-medium-low-color"), "disabled header");
    assertEqual(bg(r("off-b")), tokenHex("--ui-system-base-low-color"), "disabled selected row");
    r("off-a").dataset.state = "hover";
    assert(transparent(r("off-a")), "no hover when disabled");
    delete r("off-a").dataset.state;
  }
  setTheme("light");
});

test("contrast: selected text, ring, header and cell text", () => {
  for (const accent of ["#007CEA", "#2A9D8F", "#FFB900"]) {
    setAccent(accent);
    for (const theme of ["light", "dark"]) {
      setTheme(theme);
      const fill = tokenHex("--ui-accent-fill-color"), hover = tokenHex("--ui-accent-fill-color-pointer-over");
      const text = tokenHex("--ui-accent-button-foreground");
      assert(ratio(text, fill) >= 4.5, `${accent} ${theme} selected text ${ratio(text, fill)}`);
      assert(ratio(text, hover) >= 4.5, `${accent} ${theme} selected hover text`);
    }
  }
  setAccent("#007CEA");
  for (const theme of ["light", "dark"]) {
    setTheme(theme);
    const page = tokenHex("--ui-system-region-color");
    assert(ratio(tokenHex("--ui-system-base-medium-color"), page) >= 4.5, `${theme} header text`);
    assert(ratio(tokenHex("--ui-system-base-high-color"), page) >= 4.5, `${theme} cell text`);
    assert(ratio(tokenHex("--ui-system-accent-color"), page) >= 3, `${theme} ring`);
  }
  setTheme("light");
});

test("density: row height, padding, grip", () => {
  for (const [density, h, pad, grip, edit] of [["normal", 32, 12, 24, "11px"], ["compact", 24, 8, 16, "7px"]]) {
    setDensity(density);
    assertEqual(r("accent").getBoundingClientRect().height, h, `${density} row`);
    assertEqual(th(grid, 0).getBoundingClientRect().height, h, `${density} header`);
    assertEqual(css(cell("accent", 0), "padding-left"), `${pad}px`);
    assertEqual(css(th(grid, 0), "padding-left"), `${pad}px`);
    assertEqual(th(grid, 0).querySelector(".ui-data-grid-grip").getBoundingClientRect().height, grip);
    grid.beginEdit(cell("accent", 0));
    assertEqual(css(cell("accent", 0).querySelector("input"), "padding-left"), edit, `${density} edit padding`);
    assertEqual(cell("accent", 0).querySelector("input").getBoundingClientRect().height, h);
    grid.cancelEdit();
  }
  setDensity("normal");
});

test("right to left: mirrored columns and keys", () => {
  const g = $("rtl");
  const [a, b] = g.querySelectorAll("tbody td");
  assert(a.getBoundingClientRect().left > b.getBoundingClientRect().left, "first column at the right");
  a.focus();
  key(a, "ArrowLeft");
  assertEqual(document.activeElement, b, "Left moves to the next column");
  key(b, "ArrowRight");
  assertEqual(document.activeElement, a);
});
