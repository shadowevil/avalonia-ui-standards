<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glass</title>
<link rel="stylesheet" href="../style/index.css">
<style>
  /* Laid out like the desktop catalog's Glass page at 1064 x 626 (catalog-page-glass-*.png at 2x),
     so the backdrop area crops to the same pixels: the backdrop at (46, 172.5), 972 x 360. */
  body { margin: 0; height: 100vh; background: var(--ui-backdrop-wash); }
  .panel { position: absolute; left: 33px; top: 61px; width: 997px; height: 524px; box-sizing: border-box; padding: 12px; }
  h1 { margin: 6px 0 0 0; font-size: var(--ui-font-size-title); font-weight: var(--ui-font-weight-title); }
  h2 { margin: 26px 0 0 0; font-size: var(--ui-font-size-subtitle); font-weight: var(--ui-font-weight-subtitle); }
  .stage { position: absolute; left: 13px; top: 111.5px; width: 972px; height: 360px; overflow: clip; }
  canvas { position: absolute; left: 0; top: 0; width: 1800px; height: 900px; }
  .cards { position: absolute; left: 12px; top: 12px; display: flex; align-items: center; gap: 12px; }
  .card { display: grid; place-items: center; }
  .caption { position: absolute; left: 13px; top: 502px; margin: 0; font-size: var(--ui-font-size-caption); color: var(--ui-system-base-medium-color); }
  /* ?level=1: the panel is a plain fill, not glass, so the cards are first-level (full) glass, as
     in the desktop render made before nesting levels (0015). */
  .plain { background: color-mix(in srgb, var(--ui-glass-tint-color) 68%, transparent); border-radius: 18.88px; corner-shape: var(--ui-corner-shape); }
</style>
</head>
<body>
<div id="panel" class="panel ui-glass ui-squircle">
  <h1>Glass</h1>
  <h2>Over a backdrop</h2>
  <div class="stage">
    <canvas id="backdrop" width="3600" height="1800"></canvas>
    <div class="cards">
      <div class="card ui-glass ui-squircle" style="width: 180px; height: 140px">Glass card</div>
      <div class="card ui-glass ui-squircle" style="width: 220px; height: 160px">Glass panel</div>
      <div class="card ui-glass ui-squircle" style="width: 140px; height: 100px">Glass chip</div>
    </div>
  </div>
  <p class="caption">Glass over the catalog's backdrop. Second-level glass: blur, tint and rim.</p>
</div>
<script type="module">
import "../style/index.js"; // refraction starts by itself in Chromium

const params = new URLSearchParams(location.search);
if (params.get("level") === "1") {
  const panel = document.getElementById("panel");
  panel.classList.replace("ui-glass", "plain");
  document.querySelector(".caption").textContent = "Glass over the catalog's backdrop. First-level glass: refraction, blur, tint and rim.";
}
if (params.get("quality")) document.documentElement.dataset.glassQuality = params.get("quality");

// The catalog's GlassBackdrop (apps/Catalog/Pages/GlassPage.cs), drawn once at 2x.
const canvas = document.getElementById("backdrop");
const g = canvas.getContext("2d");
g.scale(2, 2);
const w = 1800, h = 900;
const gradient = g.createLinearGradient(0, 0, w, h);
gradient.addColorStop(0, "#FF4D4D");
gradient.addColorStop(0.3, "#FFC800");
gradient.addColorStop(0.6, "#3CCB5A");
gradient.addColorStop(1, "#1E7BFF");
g.fillStyle = gradient;
g.fillRect(0, 0, w, h);
const line = (colour, width, x1, y1, x2, y2) => {
  g.strokeStyle = colour;
  g.lineWidth = width;
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2, y2);
  g.stroke();
};
for (let x = 0.5; x < w; x += 16) line("rgba(0,0,0,0.5)", 1, x, 0, x, h);
for (let y = 0.5; y < h; y += 16) line("rgba(0,0,0,0.5)", 1, 0, y, w, y);
for (let x = -h; x < w; x += 64) line("#FFFFFF", 4, x, h, x + h, 0);
for (let y = 60; y < h; y += 120) line("#000000", 4, 0, y, w, y);
for (let x = 100; x < w; x += 260) {
  g.fillStyle = "#000080";
  g.fillRect(x, 40, 28, h - 80);
  for (const [cx, cy, r, fill] of [[x + 120, h * 0.35, 36, "#FF00FF"], [x + 170, h * 0.7, 30, "#FFFFFF"]]) {
    g.fillStyle = fill;
    g.beginPath();
    g.arc(cx, cy, r, 0, 2 * Math.PI);
    g.fill();
  }
}
</script>
</body>
</html>
