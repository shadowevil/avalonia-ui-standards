<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button family</title>
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../blocks/button.css">
<style>
  /* Laid out like the desktop catalog's Button family page at 1064 x 1024
     (catalog-page-button-family-*.png at 2x): the content panel at (33, 61), 997 wide, padded 12;
     a 24 gap between sections. */
  body { margin: 0; min-height: 100vh; background: var(--ui-backdrop-wash); }
  main { position: absolute; left: 33px; top: 61px; width: 997px; bottom: 41px; box-sizing: border-box; padding: 12px; }
  h1 { margin: 6px 0 0; font-size: var(--ui-font-size-title); font-weight: var(--ui-font-weight-title); line-height: normal; }
  h2 { margin: 24px 0 12px; font-size: var(--ui-font-size-subtitle); font-weight: var(--ui-font-weight-subtitle); line-height: normal; }
  /* The catalog's state grid: a 150 px label column, one auto column per state, 8 between
     columns, 4 between rows, each sample padded 12; it scrolls sideways when it cannot fit. */
  .states { display: grid; grid-template-columns: 150px repeat(6, auto); column-gap: 8px; row-gap: 4px; justify-content: start; align-items: center; overflow-x: auto; }
  .states > .caption { justify-self: center; font-size: var(--ui-font-size-caption); color: var(--ui-system-base-medium-color); }
  .states > .cell { justify-self: center; padding: 12px; }
  .states > .cell.forced { pointer-events: none; }
</style>
</head>
<body>
<main class="ui-glass ui-squircle">
  <h1>Button family</h1>
  <h2>ToggleButton</h2>
  <div class="states" data-rows='[["Unchecked", "toggle-false"], ["Checked", "toggle-true"], ["Indeterminate", "toggle-mixed"]]'></div>
  <h2>RepeatButton</h2>
  <div class="states" data-rows='[["RepeatButton", "repeat"]]'></div>
  <h2>SplitButton</h2>
  <div class="states" data-rows='[["SplitButton", "split"], ["ToggleSplitButton, checked", "split-checked"]]'></div>
  <h2>DropDownButton</h2>
  <div class="states" data-rows='[["DropDownButton", "drop-down"]]'></div>
  <h2>HyperlinkButton</h2>
  <div class="states" data-rows='[["HyperlinkButton", "hyperlink"]]'></div>
</main>

<template id="toggle-false"><button type="button" class="ui-button ui-squircle ui-focus-ring" aria-pressed="false">Toggle</button></template>
<template id="toggle-true"><button type="button" class="ui-button ui-squircle ui-focus-ring" aria-pressed="true">Toggle</button></template>
<template id="toggle-mixed"><button type="button" class="ui-button ui-squircle ui-focus-ring" aria-pressed="mixed">Toggle</button></template>
<template id="repeat"><button type="button" class="ui-button ui-repeat-button ui-squircle ui-focus-ring">Repeat</button></template>
<template id="split"><span class="ui-split-button ui-squircle ui-focus-ring-within" role="group"><button type="button" class="ui-button">Split</button><button type="button" class="ui-button ui-drop-down-button" aria-label="More options" aria-haspopup="menu" aria-expanded="false"></button></span></template>
<template id="split-checked"><span class="ui-split-button ui-squircle ui-focus-ring-within" role="group"><button type="button" class="ui-button" aria-pressed="true">Split</button><button type="button" class="ui-button ui-drop-down-button" aria-label="More options" aria-haspopup="menu" aria-expanded="false"></button></span></template>
<template id="drop-down"><button type="button" class="ui-button ui-drop-down-button ui-squircle ui-focus-ring" aria-haspopup="menu" aria-expanded="false">Drop down</button></template>
<template id="hyperlink"><a class="ui-button ui-hyperlink-button ui-squircle ui-focus-ring" href="#hyperlink">Link</a></template>

<script type="module">
import "../blocks/button.js";

const states = ["Rest", "Hover", "Pressed", "Disabled", "Focused", "Live"];

// Forces a state on a sample: hover and press on the button (a split button's primary half),
// focus on the control, disabled on every button in it.
function force(sample, state) {
  const buttons = sample.matches(".ui-button") ? [sample] : [...sample.querySelectorAll(".ui-button")];
  for (const b of buttons) b.tabIndex = -1;
  if (state === "Hover") buttons[0].dataset.state = "hover";
  if (state === "Pressed") buttons[0].dataset.state = "pressed";
  if (state === "Focused") sample.dataset.state = "focus";
  if (state === "Disabled") {
    for (const b of buttons) {
      if (b.localName === "a") {
        b.removeAttribute("href");
        b.setAttribute("role", "link");
        b.setAttribute("aria-disabled", "true");
      } else {
        b.disabled = true;
      }
    }
  }
}

for (const grid of document.querySelectorAll(".states")) {
  const add = (cls, child) => {
    const el = document.createElement("div");
    el.className = cls;
    el.append(child);
    grid.append(el);
  };
  grid.append(document.createElement("div"));
  for (const s of states) add("caption", s);
  for (const [label, template] of JSON.parse(grid.dataset.rows)) {
    add("label", label);
    for (const s of states) {
      const sample = document.getElementById(template).content.firstElementChild.cloneNode(true);
      if (s !== "Live") force(sample, s);
      add(s === "Live" ? "cell" : "cell forced", sample);
    }
  }
}
</script>
</body>
</html>
